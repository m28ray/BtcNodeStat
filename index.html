<!DOCTYPE html>
<html lang="en" class="h-100" data-bs-theme="dark">
  	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="Bitcoin Node Status Dashboard">
		<meta name="author" content="">
		<link rel="icon" href="favicon.ico">

		<title>Bitcoin Node x.x.x.x</title>

		<!-- Modern Bootstrap 5.3 CSS -->
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

		<style type="text/css">
			/* Custom zebra colors that safely adapt to Bootstrap's dark/light modes */
			tr.inbound-in td {
				--bs-table-bg: var(--bs-body-bg);
			}
			tr.inbound-out td {
				--bs-table-bg: var(--bs-secondary-bg);
			}
		</style>
  	</head>

  	<body class="d-flex flex-column h-100">

		<!-- Main Container Layout -->
		<main class="flex-shrink-0">
			<div class="container-fluid my-5">
				
				<!-- Header section -->
				<div class="row mb-4">
					<div class="col-12">
						<div class="pb-3 border-bottom d-flex align-items-center justify-content-between">
							<h1 class="display-5 fw-bold mb-0">Bitcoin Node x.x.x.x</h1>
							<button id="themeToggler" class="btn btn-outline-secondary">
  								Toggle Theme
							</button>
						</div>
					</div>
				</div>

				<!-- Blockchain, Network & Totals Row (Cards instead of bare dl-lists) -->
				<div class="row g-4 mb-5">
					<div class="col-md-4">
						<div class="card h-100 shadow-sm">
							<div class="card-header fw-bold bg-body-tertiary">Blockchain Info</div>
							<div class="card-body">
								<dl id="blockchaininfo" class="row g-2 mb-0"></dl>
							</div>
						</div>
					</div>
					<div class="col-md-4">
						<div class="card h-100 shadow-sm">
							<div class="card-header fw-bold bg-body-tertiary">Network Info</div>
							<div class="card-body">
								<dl id="networkinfo" class="row g-2 mb-0"></dl>
							</div>
						</div>
					</div>
					<div class="col-md-4">
						<div class="card h-100 shadow-sm">
							<div class="card-header fw-bold bg-body-tertiary">Network Totals</div>
							<div class="card-body">
								<dl id="nettotals" class="row g-2 mb-0"></dl>
							</div>
						</div>
					</div>
				</div>

				<!-- Peer List Section -->
				<div class="row">
					<div class="col-12">
						<div class="card shadow-sm">
							<div class="card-header fw-bold bg-body-tertiary">Connected Peers</div>
							<div class="card-body p-0">
								<div class="table-responsive" id="peerinfo-container">
									<!-- Injected Table goes here -->
								</div>
							</div>
						</div>
					</div>
				</div>
	  		
			</div>
		</main>

		<!-- Modern Utility Sticky Footer -->
		<footer class="footer mt-auto py-3 bg-body-tertiary border-top">
		  	<div class="container">
				<p class="text-muted text-center mb-0 small">tip : address</p>
	  		</div>
		</footer>

		<!-- Vanilla JavaScript Application Logic -->
		<script type="text/javascript">
			document.addEventListener("DOMContentLoaded", () => {
				
				// Utility helper functions
				const tsToDate = (ts) => new Date(ts * 1000).toString();

				const bytesToSize = (bytes) => {
					if (bytes === 0) return '0 Byte';
					const k = 1000;
					const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
					const i = Math.floor(Math.log(bytes) / Math.log(k));
					return (bytes / Math.pow(k, i)).toPrecision(3) + ' ' + sizes[i];
				};

				// Generic helper function to render descriptions into standard grids
				const createDlItems = (data, allowedKeys) => {
					let html = '';
					for (const [key, value] of Object.entries(data)) {
						if (allowedKeys.includes(key)) {
							html += `
								<dt class="col-sm-5 text-truncate small text-secondary uppercase">${key}</dt>
								<dd class="col-sm-7 mb-0 text-end font-monospace fw-semibold">${value}</dd>
							`;
						}
					}
					return html;
				};

				// Fetch 1: Blockchain Info
				fetch("getblockchaininfo.json", { cache: 'no-store' })
					.then(response => response.json())
					.then(data => {
						const allowed = ["chain", "blocks", "headers", "difficulty", "mediantime", "verificationprogress", "chainwork", "pruned"];
						document.getElementById("blockchaininfo").innerHTML = createDlItems(data, allowed);
					})
					.catch(err => console.error("Error loading blockchain info:", err));

				// Fetch 2: Network Info
				fetch("getnetworkinfo.json", { cache: 'no-store' })
					.then(response => response.json())
					.then(data => {
						const allowed = ["connections", "connections_in", "connections_out", "version", "subversion", "protocolversion"];
						document.getElementById("networkinfo").innerHTML = createDlItems(data, allowed);
					})
					.catch(err => console.error("Error loading network info:", err));

				// Fetch 3: Network Totals
				fetch("getnettotals.json", { cache: 'no-store' })
					.then(response => response.json())
					.then(data => {
						data['totalbytesrecv'] = bytesToSize(data['totalbytesrecv']);
						data['totalbytessent'] = bytesToSize(data['totalbytessent']);
						data['timemillis'] = tsToDate(data['timemillis'] / 1000);
						// A quick fix to access nested data in createDlItems
						data['maxuploadtarget'] = bytesToSize(data['uploadtarget']['target']);

						const allowed = ["totalbytesrecv", "totalbytessent", "timemillis", "maxuploadtarget"];
						document.getElementById("nettotals").innerHTML = createDlItems(data, allowed);
					})
					.catch(err => console.error("Error loading net totals:", err));

				// Fetch 4: Peer Info Table (Replacing Mustache)
				fetch("getpeerinfo.json", { cache: 'no-store' })
					.then(response => response.json())
					.then(data => {
						if (!data || data.length === 0) {
							document.getElementById("peerinfo-container").innerHTML = `<div class="p-3 text-center text-muted">No peers connected.</div>`;
							return;
						}

						// Build table headers and baseline HTML using modern Template Literals
						let tableHtml = `
							<table class="table table-sm align-middle mb-0">
								<thead class="table-light text-secondary small uppercase">
									<tr>
										<th class="ps-3">addr</th>
										<th>in/outbound</th>
										<th>bytessent</th>
										<th>bytesrecv</th>
										<th>conntime</th>
										<th>pingtime</th>
										<th>version</th>
										<th class="pe-3">subver</th>
									</tr>
								</thead>
								<tbody>
						`;

						// Map over rows directly inside JavaScript
						tableHtml += data.map(peer => {
							const inboundClass = peer.inbound ? "in" : "out";
							const inboundText = peer.inbound ? "in" : "out";
							const formattedConnTime = tsToDate(peer.conntime);
							const formattedSent = bytesToSize(peer.bytessent);
							const formattedRecv = bytesToSize(peer.bytesrecv);

							return `
								<tr class="inbound-${inboundClass} small">
									<td class="ps-3 font-monospace">${peer.addr}</td>
									<td><span class="badge ${peer.inbound ? 'bg-info-subtle text-info-emphasis' : 'bg-warning-subtle text-warning-emphasis'}">${inboundText}</span></td>
									<td>${formattedSent}</td>
									<td>${formattedRecv}</td>
									<td>${formattedConnTime}</td>
									<td>${peer.pingtime ? peer.pingtime + 's' : 'N/A'}</td>
									<td>${peer.version}</td>
									<td class="pe-3 font-monospace">${peer.subver}</td>
								</tr>
							`;
						}).join('');

						tableHtml += `
								</tbody>
							</table>
						`;

						document.getElementById("peerinfo-container").innerHTML = tableHtml;
					})
					.catch(err => console.error("Error loading peer info:", err));
			});


			// On page load: check if a theme preference was saved previously
			const savedTheme = localStorage.getItem('theme') || 'dark';
			document.documentElement.setAttribute('data-bs-theme', savedTheme);

			document.getElementById('themeToggler').addEventListener('click', () => {
			  const htmlElement = document.documentElement;
			  const currentTheme = htmlElement.getAttribute('data-bs-theme');
			  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
			  
			  htmlElement.setAttribute('data-bs-theme', newTheme);
			  localStorage.setItem('theme', newTheme); // Save preference
			});


		</script>
  	</body>
</html>
